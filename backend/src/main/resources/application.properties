spring.application.name=backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Port
server.port=8080
app.upload.dir=uploads

# Optional, one-time admin-key bootstrap. Supply ADMIN_SEED_KEY through the
# deployment environment; its BCrypt hash is stored in the admin_keys table.
# Do not put the raw admin key in this file or commit it to source control.
app.admin.seed-key=${ADMIN_SEED_KEY:}

# Razorpay test mode keys. Prefer overriding the secret with RAZORPAY_KEY_SECRET outside source.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_SxpSrbIRPJ6bWL}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:6Kga8oEf6Qj9k0LJnT4s5WhF}
razorpay.currency=INR
