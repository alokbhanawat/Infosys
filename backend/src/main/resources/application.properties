spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# MySQL Database Configuration
# Set these values in Railway. Do not commit real database credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Port and uploads
server.port=${PORT:8080}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET}

# Optional, one-time admin-key bootstrap. Supply ADMIN_SEED_KEY through the
# deployment environment; its BCrypt hash is stored in the admin_keys table.
# Do not put the raw admin key in this file or commit it to source control.
app.admin.seed-key=${ADMIN_SEED_KEY:}

# Configure Razorpay keys only in Railway environment variables.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
